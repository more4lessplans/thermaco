<style>
  html, body {

     framing the content at the edges instead of sitting behind it */

    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(203,214,157,0.55) 1px, transparent 1.5px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 25%, black 85%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 25%, black 85%);
    opacity: .35;
  }

  .focus-ring:focus-visible { outline: 2px solid #82983A; outline-offset: 3px; }
  .tap-btn { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { opacity: 0; transform: translateY(14px) scale(.99); filter: blur(3px); animation: reveal .8s cubic-bezier(.16,1,.3,1) forwards; }
    .reveal-1 { animation-delay: .05s; }
    .reveal-2 { animation-delay: .14s; }
    .reveal-3 { animation-delay: .24s; }
    .reveal-4 { animation-delay: .34s; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

    /* slow, ambient rotation on the dial — reads as "idle," not broken.
       Very slow (40s) so it registers as atmosphere, not an animation. */
    .dial-spin { animation: dialSpin 40s linear infinite; transform-origin: 50% 50%; }
    @keyframes dialSpin { to { transform: rotate(360deg); } }
  }

  .home-btn { transition: background-color .25s ease, transform .2s cubic-bezier(.16,1,.3,1); }
